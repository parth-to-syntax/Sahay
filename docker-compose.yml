services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sahay-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api-gateway:
    image: node:20
    working_dir: /workspace
    volumes:
      - ./services/api-gateway/backend:/workspace
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/intellihr}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ai-orchestrator:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      - mongo
      - ai-orchestrator

  ai-orchestrator:
    image: node:20
    working_dir: /workspace
    volumes:
      - ./services/ai-orchestrator/llm:/workspace
    command: sh -c "npm install && npm run start:server"
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/intellihr}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GROQ_API_KEY: ${GROQ_API_KEY}
      QUEUE_MODE: ${QUEUE_MODE:-auto}
    depends_on:
      - mongo
      - redis

  frontend:
    image: node:20
    working_dir: /workspace
    volumes:
      - ./frontend/hero-app:/workspace
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-http://localhost:4000}
      VITE_ORG_ID: ${VITE_ORG_ID:-demo}
    depends_on:
      - api-gateway

volumes:
  sahay-mongo-data:

networks:
  default:
    name: sahay_default
