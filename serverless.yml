# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: parthsrivastava660
service: sahay-app

plugins:
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 512
  timeout: 29
  environment:
    NODE_ENV: production
    MONGO_URI: ${env:MONGO_URI}
    DEMO_MODE: "true"
    GROQ_API_KEY: ${env:GROQ_API_KEY}
    CORS_ORIGIN: ${env:CORS_ORIGIN}
    QUEUE_MODE: "sqs"
    SQS_INGESTION_QUEUE_URL: !Ref IngestionQueue
    SQS_ANALYSIS_QUEUE_URL: !Ref AnalysisQueue
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - Fn::GetAtt: [ IngestionQueue, Arn ]
            - Fn::GetAtt: [ AnalysisQueue, Arn ]

package:
  patterns:
    - '!.git/**'
    - '!frontend/**'
    - '!docs/**'
    - '!integrations/**'
    - '!scripts/**'
    - '!.agents/**'
    - '!Sahay_API.postman_collection.json'
    - '!public-openapi.yaml'

functions:
  backendApi:
    handler: backend/src/lambda.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: '*'
        
  llmApi:
    handler: llm/server/lambda.handler
    timeout: 30
    events:
      - httpApi:
          path: /llm/{proxy+}
          method: '*'

  ingestionWorker:
    handler: llm/server/queues/sqsHandlers.ingestionWorkerHandler
    timeout: 60
    events:
      - sqs:
          arn:
            Fn::GetAtt: [ IngestionQueue, Arn ]

  analysisWorker:
    handler: llm/server/queues/sqsHandlers.analysisWorkerHandler
    timeout: 300
    events:
      - sqs:
          arn:
            Fn::GetAtt: [ AnalysisQueue, Arn ]

resources:
  Resources:
    IngestionQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: pipeline-ingestion-queue
        VisibilityTimeout: 90
    AnalysisQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: pipeline-analysis-queue
        VisibilityTimeout: 330

    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: sahay-frontend-${aws:accountId}-${sls:stage}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerPreferred

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: FrontendBucket
        PolicyDocument:
          Statement:
            - Action: 's3:GetObject'
              Effect: Allow
              Principal: '*'
              Resource:
                Fn::Join:
                  - ''
                  - - 'arn:aws:s3:::'
                    - Ref: FrontendBucket
                    - '/*'

  Outputs:
    FrontendURL:
      Description: "S3 Website URL for the frontend"
      Value:
        Fn::Join: ['', ['http://', Fn::GetAtt: [FrontendBucket, WebsiteURL]]]
